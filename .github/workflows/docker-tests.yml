name: Platform PR CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: Validate Platform Installation
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Platform
        run: |
          interactive=false clone_platform=false ./install-and-launch.sh

      - name: Check Health
        run: |
          ./postflight_checks.sh

  derive-drift-check:
    name: Derive drift check (${{ matrix.target }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [dev-be, dev-hydra]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify derivation
        env:
          TARGET: ${{ matrix.target }}
        run: ./derive/verify.sh "$TARGET"
